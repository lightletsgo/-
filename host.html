<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사회자 대시보드</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.container { max-width: 720px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
.sub-card { display: flex; gap: 12px; align-items: center; }
.sub-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
.sub-info { flex: 1; }
.sub-actions { display: flex; gap: 6px; }
.sub-actions button { width: auto; padding: 8px 14px; font-size: 13px; margin: 0; }
.approve-btn { background: #4caf6d; }
.reject-btn { background: #e04545; }
.room-code-display { text-align: center; font-size: 28px; font-weight: bold; letter-spacing: 4px; color: #ff7a45; margin: 10px 0; }
.sub-actions button:disabled { opacity: 0.5; }
#toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: #333; color: #fff; padding: 10px 20px; border-radius: 8px;
  font-size: 14px; z-index: 999; opacity: 0; transition: all 0.25s ease;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.steal-btn { background: #7e57c2; }
.guess-box { background: #f7f4fc; border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎤 사회자 대시보드</h1>
  <div id="content"></div>
</div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
let currentRoomId = localStorage.getItem('host_room_id');
let currentRoomCode = localStorage.getItem('host_room_code');
const contentEl = document.getElementById('content');
let refreshTimer = null;

function init() {
  if (currentRoomId) {
    showDashboard();
  } else {
    showEntry();
  }
}

function showEntry() {
  contentEl.innerHTML = `
    <div class="card">
      <p><b>새 방 만들기</b></p>
      <input type="text" id="hostName" placeholder="사회자 이름">
      <button id="createRoomBtn">방 만들기</button>
    </div>
    <div class="card">
      <p><b>이미 만든 방 열기</b></p>
      <input type="text" id="existingCode" placeholder="방 코드 입력">
      <div class="error-msg" id="entryError"></div>
      <button id="openRoomBtn" class="secondary">방 열기</button>
    </div>
  `;

  document.getElementById('createRoomBtn').addEventListener('click', async () => {
    const hostName = document.getElementById('hostName').value.trim() || '사회자';
    const code = String(Math.floor(1000 + Math.random() * 9000));
    const { data, error } = await supabaseClient
      .from('rooms')
      .insert({ room_code: code, host_name: hostName })
      .select()
      .single();
    if (error) {
      alert('오류: ' + error.message);
      return;
    }
    currentRoomId = data.id;
    currentRoomCode = data.room_code;
    localStorage.setItem('host_room_id', currentRoomId);
    localStorage.setItem('host_room_code', currentRoomCode);
    showDashboard();
  });

  document.getElementById('openRoomBtn').addEventListener('click', async () => {
    const code = document.getElementById('existingCode').value.trim();
    const { data, error } = await supabaseClient
      .from('rooms')
      .select('*')
      .eq('room_code', code)
      .single();
    if (error || !data) {
      document.getElementById('entryError').textContent = '존재하지 않는 방 코드예요.';
      return;
    }
    currentRoomId = data.id;
    currentRoomCode = data.room_code;
    localStorage.setItem('host_room_id', currentRoomId);
    localStorage.setItem('host_room_code', currentRoomCode);
    showDashboard();
  });
}

async function showDashboard() {
  contentEl.innerHTML = `
    <div class="room-code-display">방 코드: ${currentRoomCode}</div>
    <p class="subtitle">이 코드를 친구들에게 공유하세요</p>
    <button id="switchRoomBtn" class="secondary">다른 방으로 전환</button>
    <div class="card">
      <p><b>⏱ 실패 시 재도전 대기 시간</b></p>
      <input type="number" id="penaltyInput" min="0" style="width:80px;display:inline-block;"> 분
      <button id="savePenaltyBtn" style="width:auto;padding:8px 14px;margin-left:8px;">저장</button>
    </div>
    <div class="card">
      <p><b>🎯 1인당 뺏기 시도 가능 횟수</b></p>
      <input type="number" id="stealLimitInput" min="0" style="width:80px;display:inline-block;"> 회
      <button id="saveStealLimitBtn" style="width:auto;padding:8px 14px;margin-left:8px;">저장</button>
    </div>
    <h3>📥 승인 대기 중인 제출</h3>
    <div id="pendingList"></div>
    <h3>🎯 뺏기 시도 대기</h3>
    <div id="stealPendingList"></div>
    <h3>📊 전체 참가자 현황</h3>
    <div id="statusTable"></div>
  `;
  document.getElementById('switchRoomBtn').addEventListener('click', () => {
    localStorage.removeItem('host_room_id');
    localStorage.removeItem('host_room_code');
    currentRoomId = null;
    if (refreshTimer) clearInterval(refreshTimer);
    showEntry();
  });

  await loadPenaltySetting();
  document.getElementById('savePenaltyBtn').addEventListener('click', async () => {
    const val = parseInt(document.getElementById('penaltyInput').value, 10);
    if (isNaN(val) || val < 0) {
      alert('0 이상의 숫자를 입력해주세요.');
      return;
    }
    await supabaseClient.from('rooms').update({ penalty_minutes: val }).eq('id', currentRoomId);
    showToast(`⏱ 페널티 ${val}분으로 저장했어요`);
  });

  await loadStealLimitSetting();
  document.getElementById('saveStealLimitBtn').addEventListener('click', async () => {
    const val = parseInt(document.getElementById('stealLimitInput').value, 10);
    if (isNaN(val) || val < 0) {
      alert('0 이상의 숫자를 입력해주세요.');
      return;
    }
    await supabaseClient.from('rooms').update({ steal_limit: val }).eq('id', currentRoomId);
    showToast(`🎯 뺏기 ${val}회로 저장했어요`);
  });

  await refreshAll();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(refreshAll, 5000);
}

async function loadPenaltySetting() {
  const { data: room } = await supabaseClient
    .from('rooms')
    .select('penalty_minutes')
    .eq('id', currentRoomId)
    .single();
  document.getElementById('penaltyInput').value = (room && typeof room.penalty_minutes === 'number') ? room.penalty_minutes : 10;
}

async function loadStealLimitSetting() {
  const { data: room } = await supabaseClient
    .from('rooms')
    .select('steal_limit')
    .eq('id', currentRoomId)
    .single();
  document.getElementById('stealLimitInput').value = (room && typeof room.steal_limit === 'number') ? room.steal_limit : 5;
}

async function refreshAll() {
  await loadPending();
  await loadStealPending();
  await loadStatusTable();
}

async function loadStealPending() {
  const { data: attempts } = await supabaseClient
    .from('steal_attempts')
    .select('*, participants(nickname)')
    .eq('room_id', currentRoomId)
    .eq('status', 'pending');

  const el = document.getElementById('stealPendingList');
  if (!attempts || attempts.length === 0) {
    el.innerHTML = '<div class="card status">대기 중인 뺏기 시도가 없어요</div>';
    return;
  }

  let html = '';
  for (const a of attempts) {
    const { data: target } = await supabaseClient
      .from('assigned_missions')
      .select('*, missions_master(*), participants(nickname)')
      .eq('id', a.target_assigned_mission_id)
      .maybeSingle();

    if (!target) continue;

    html += `
      <div class="card">
        <b>${a.participants?.nickname || '알 수 없음'}</b> 님이
        <b>${target.participants?.nickname || '알 수 없음'}</b> 님의 ${target.level}단계 미션에 도전<br>
        <span style="color:#888;font-size:13px;">실제 미션: ${target.missions_master?.content || '-'}</span>
        <div class="guess-box">🗣 추측: ${a.guess_text}</div>
      </div>
      <div class="sub-actions" style="margin-bottom:16px;">
        <button class="approve-btn steal-approve-btn" onclick="approveSteal('${a.id}', '${target.id}', ${target.level}, this)">✅ 성공 인정</button>
        <button class="reject-btn" onclick="rejectSteal('${a.id}', this)">❌ 실패 처리</button>
      </div>
    `;
  }
  el.innerHTML = html || '<div class="card status">대기 중인 뺏기 시도가 없어요</div>';
}

const STEAL_PRIZE_BY_LEVEL = { 1: 1000, 2: 2000, 3: 3000 };

async function approveSteal(attemptId, targetAssignedId, targetLevel, btn) {
  if (btn) disableCardButtons(btn, '처리 중...');
  const prize = STEAL_PRIZE_BY_LEVEL[targetLevel] || 0;
  await supabaseClient.from('steal_attempts').update({ status: 'approved', prize, resolved_at: new Date().toISOString() }).eq('id', attemptId);
  await supabaseClient.from('assigned_missions').update({ status: 'stolen' }).eq('id', targetAssignedId);
  showToast('✅ 뺏기 성공 처리했어요');
  refreshAll();
}

async function rejectSteal(attemptId, btn) {
  if (btn) disableCardButtons(btn, '처리 중...');
  await supabaseClient.from('steal_attempts').update({ status: 'rejected', resolved_at: new Date().toISOString() }).eq('id', attemptId);
  showToast('❌ 뺏기 실패 처리했어요');
  refreshAll();
}

async function loadPending() {
  const { data: assignedList } = await supabaseClient
    .from('assigned_missions')
    .select('*, missions_master(*), participants!inner(nickname, room_id)')
    .eq('participants.room_id', currentRoomId)
    .eq('status', 'submitted');

  const pendingEl = document.getElementById('pendingList');
  if (!assignedList || assignedList.length === 0) {
    pendingEl.innerHTML = '<div class="card status">대기 중인 제출이 없어요</div>';
    return;
  }

  let html = '';
  for (const am of assignedList) {
    const { data: sub } = await supabaseClient
      .from('submissions')
      .select('*')
      .eq('assigned_mission_id', am.id)
      .order('submitted_at', { ascending: false })
      .limit(1)
      .maybeSingle();

    if (!sub) continue;
    if (sub.approved !== null) continue; // 이미 승인/반려 처리된 건 제외

    const isImage = /\.(jpe?g|png|gif|webp)$/i.test(sub.media_url || '');

    html += `
      <div class="card sub-card">
        ${isImage
          ? `<img class="sub-thumb" src="${sub.media_url}">`
          : `<div class="sub-thumb"></div>`}
        <div class="sub-info">
          <b>${am.participants.nickname}</b> · ${am.level}단계<br>
          ${am.missions_master.content}<br>
          <a href="${sub.media_url}" target="_blank">파일 열기</a>
        </div>
      </div>
      <div class="sub-actions" style="margin-bottom:16px;">
        <button class="approve-btn" onclick="approveSubmission('${sub.id}', '${am.id}', this)">✅ 승인</button>
        <button class="reject-btn" onclick="rejectSubmission('${sub.id}', '${am.id}', this)">❌ 반려</button>
      </div>
    `;
  }
  pendingEl.innerHTML = html || '<div class="card status">대기 중인 제출이 없어요</div>';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
}

function disableCardButtons(btn, label) {
  const actions = btn.closest('.sub-actions');
  if (!actions) return;
  actions.querySelectorAll('button').forEach(b => b.disabled = true);
  btn.textContent = label;
}

async function approveSubmission(subId, assignedId, btn) {
  if (btn) disableCardButtons(btn, '처리 중...');
  await supabaseClient.from('submissions').update({ approved: true, approved_at: new Date().toISOString() }).eq('id', subId);
  showToast('✅ 승인했어요');
  refreshAll();
}

async function rejectSubmission(subId, assignedId, btn) {
  if (btn) disableCardButtons(btn, '처리 중...');
  await supabaseClient.from('submissions').update({ approved: false, approved_at: new Date().toISOString() }).eq('id', subId);
  showToast('❌ 반려했어요');
  refreshAll();
}

async function loadStatusTable() {
  const { data: participants } = await supabaseClient
    .from('participants')
    .select('*')
    .eq('room_id', currentRoomId);

  const statusEl = document.getElementById('statusTable');
  if (!participants || participants.length === 0) {
    statusEl.innerHTML = '<div class="card status">아직 참가자가 없어요</div>';
    return;
  }

  let rows = '';
  for (const p of participants) {
    const { data: completed } = await supabaseClient
      .from('assigned_missions')
      .select('*, missions_master(base_prize)')
      .eq('participant_id', p.id)
      .eq('status', 'completed');

    const { data: steals } = await supabaseClient
      .from('steal_attempts')
      .select('prize')
      .eq('challenger_participant_id', p.id)
      .eq('status', 'approved');

    const missionTotal = (completed || []).reduce((sum, c) => sum + (c.final_prize ?? c.missions_master?.base_prize ?? 0), 0);
    const stealTotal = (steals || []).reduce((sum, s) => sum + (s.prize || 0), 0);
    const total = missionTotal + stealTotal;
    const maxLevel = (completed || []).reduce((max, c) => Math.max(max, c.level), 0);

    rows += `<tr><td>${p.nickname}</td><td>${maxLevel > 0 ? maxLevel + '단계 완료' : '-'}</td><td>${total.toLocaleString()}원${stealTotal > 0 ? ` <span style="color:#7e57c2;font-size:12px;">(뺏기 ${stealTotal.toLocaleString()}원 포함)</span>` : ''}</td></tr>`;
  }

  statusEl.innerHTML = `
    <div class="card">
      <table>
        <tr><th>닉네임</th><th>최고 완료 단계</th><th>확정 상금</th></tr>
        ${rows}
      </table>
    </div>
  `;
}

init();
</script>
</body>
</html>
