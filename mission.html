<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 미션</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.rank-btn-wrap { text-align: center; margin-bottom: 10px; }
#rankBtn { width: auto; padding: 8px 16px; font-size: 14px; background: #ffb74d; }
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 12px; padding: 20px; width: 90%; max-width: 420px;
  max-height: 80vh; overflow-y: auto;
}
.modal-box h3 { margin-top: 0; }
.rank-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 4px; border-bottom: 1px solid #eee; font-size: 14px;
}
.rank-row.me { background: #fff7e6; border-radius: 6px; }
.rank-num { width: 28px; font-weight: bold; color: #ff7a45; }
.rank-nick { flex: 1; margin-left: 6px; }
.rank-detail { color: #888; font-size: 13px; }
#closeRankBtn { margin-top: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1 id="greeting">내 미션</h1>
  <p class="subtitle" id="subtitle"></p>
  <div class="rank-btn-wrap">
    <button id="rankBtn">🏆 순위 보기</button>
  </div>
  <div id="content"></div>
</div>

<div class="modal-overlay" id="rankModal">
  <div class="modal-box">
    <h3>🏆 전체 순위</h3>
    <div id="rankList">불러오는 중...</div>
    <button id="closeRankBtn" class="secondary">닫기</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const participantId = localStorage.getItem('participant_id');
const nickname = localStorage.getItem('nickname');
const contentEl = document.getElementById('content');
document.getElementById('subtitle').textContent = nickname ? nickname + '님' : '';

if (!participantId) {
  window.location.href = 'index.html';
}

let pollTimer = null;

document.getElementById('rankBtn').addEventListener('click', openRanking);
document.getElementById('closeRankBtn').addEventListener('click', () => {
  document.getElementById('rankModal').classList.remove('show');
});

async function openRanking() {
  const modal = document.getElementById('rankModal');
  const listEl = document.getElementById('rankList');
  modal.classList.add('show');
  listEl.innerHTML = '불러오는 중...';

  const { data: me } = await supabaseClient
    .from('participants')
    .select('room_id')
    .eq('id', participantId)
    .single();

  if (!me) {
    listEl.innerHTML = '<div class="error-msg">순위를 불러오지 못했어요.</div>';
    return;
  }

  const { data: participants } = await supabaseClient
    .from('participants')
    .select('*')
    .eq('room_id', me.room_id);

  if (!participants || participants.length === 0) {
    listEl.innerHTML = '<div class="status">아직 참가자가 없어요</div>';
    return;
  }

  const results = [];
  for (const p of participants) {
    const { data: completed } = await supabaseClient
      .from('assigned_missions')
      .select('*, missions_master(base_prize)')
      .eq('participant_id', p.id)
      .eq('status', 'completed');

    const total = (completed || []).reduce((sum, c) => sum + (c.final_prize ?? c.missions_master?.base_prize ?? 0), 0);
    results.push({ id: p.id, nickname: p.nickname, total });
  }

  results.sort((a, b) => b.total - a.total);

  listEl.innerHTML = results.map((r, i) => `
    <div class="rank-row ${r.id === participantId ? 'me' : ''}">
      <span class="rank-num">${i + 1}</span>
      <span class="rank-nick">${r.nickname}${r.id === participantId ? ' (나)' : ''}</span>
      <span class="rank-detail">${r.total.toLocaleString()}원</span>
    </div>
  `).join('');
}

async function init() {
  const { data: active } = await supabaseClient
    .from('assigned_missions')
    .select('*, missions_master(*)')
    .eq('participant_id', participantId)
    .in('status', ['진행중', 'submitted'])
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  if (active) {
    if (active.status === '진행중') {
      renderMissionCard(active);
    } else {
      renderWaiting(active);
    }
  } else {
    renderLevelSelect();
  }
}

const PRIZE_TABLE = {
  '1-false': 1000,
  '2-false': 2000,
  '2-true': 3000,
  '3-false': 3000,
  '3-true': 6000
};

function getFinalPrize(assigned) {
  const key = `${assigned.level}-${assigned.via_double === true}`;
  return PRIZE_TABLE[key] ?? 0;
}


function renderLevelSelect() {
  contentEl.innerHTML = `
    <div class="card">
      <p>도전할 단계를 선택하세요</p>
      <div class="level-buttons">
        <button data-level="1">1단계</button>
        <button data-level="2">2단계</button>
        <button data-level="3">3단계</button>
      </div>
    </div>
  `;
  document.querySelectorAll('[data-level]').forEach(btn => {
    btn.addEventListener('click', () => assignMission(parseInt(btn.dataset.level), false));
  });
}

async function assignMission(level, fromDouble) {
  contentEl.innerHTML = '<div class="status">미션 뽑는 중...</div>';

  // 이 참가자가 이미 받았던 미션 id 목록 조회 (중복 방지)
  const { data: previous } = await supabaseClient
    .from('assigned_missions')
    .select('mission_id')
    .eq('participant_id', participantId);

  const usedIds = (previous || []).map(p => p.mission_id);

  let query = supabaseClient
    .from('missions_master')
    .select('*')
    .eq('level', level);

  if (usedIds.length > 0) {
    query = query.not('id', 'in', `(${usedIds.join(',')})`);
  }

  const { data: missions, error } = await query;

  if (error) {
    contentEl.innerHTML = '<div class="error-msg">미션을 불러오지 못했어요.</div>';
    return;
  }

  if (!missions || missions.length === 0) {
    contentEl.innerHTML = `
      <div class="card status">이 단계의 미션을 모두 수행하셨어요! 다른 단계를 선택해보세요.</div>
      <button id="backToLevelBtn" class="secondary">단계 다시 선택하기</button>
    `;
    document.getElementById('backToLevelBtn').addEventListener('click', renderLevelSelect);
    return;
  }

  const randomMission = missions[Math.floor(Math.random() * missions.length)];

  const { data: assigned, error: aError } = await supabaseClient
    .from('assigned_missions')
    .insert({
      participant_id: participantId,
      mission_id: randomMission.id,
      level: level,
      status: '진행중',
      via_double: !!fromDouble
    })
    .select('*, missions_master(*)')
    .single();

  if (aError) {
    contentEl.innerHTML = '<div class="error-msg">배정 중 오류: ' + aError.message + '</div>';
    return;
  }

  renderMissionCard(assigned);
}

function renderMissionCard(assigned) {
  const m = assigned.missions_master;
  contentEl.innerHTML = `
    <div class="card">
      <span class="badge">${m.level}단계 · ${m.category}</span>
      <div class="mission-content">${m.content}</div>
      <div class="prize">${m.prize_text}</div>
    </div>
    <div class="card">
      <p>📸 인증 자료를 올려주세요 (사진 또는 음성 파일)</p>
      <input type="file" id="fileInput" accept="image/*,audio/*">
      <div class="error-msg" id="submitError"></div>
      <button id="submitBtn">인증 제출하기</button>
    </div>
  `;

  document.getElementById('submitBtn').addEventListener('click', () => submitProof(assigned));
}

async function submitProof(assigned) {
  const fileInput = document.getElementById('fileInput');
  const submitError = document.getElementById('submitError');
  submitError.textContent = '';

  if (!fileInput.files || fileInput.files.length === 0) {
    submitError.textContent = '파일을 선택해주세요.';
    return;
  }

  const file = fileInput.files[0];
  const extMatch = file.name.match(/\.[0-9a-zA-Z]+$/);
  const ext = extMatch ? extMatch[0] : '';
  const filePath = `${assigned.id}/${Date.now()}${ext}`;

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = '업로드 중...';

  const { error: uploadError } = await supabaseClient
    .storage
    .from('mission-media')
    .upload(filePath, file);

  if (uploadError) {
    submitError.textContent = '업로드 실패: ' + uploadError.message;
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = '인증 제출하기';
    return;
  }

  const { data: urlData } = supabaseClient.storage.from('mission-media').getPublicUrl(filePath);

  await supabaseClient.from('submissions').insert({
    assigned_mission_id: assigned.id,
    media_url: urlData.publicUrl
  });

  await supabaseClient
    .from('assigned_missions')
    .update({ status: 'submitted' })
    .eq('id', assigned.id);

  renderWaiting(assigned);
}

function renderWaiting(assigned) {
  contentEl.innerHTML = `
    <div class="card status">
      ✅ 제출 완료!<br>사회자 승인을 기다리는 중이에요...
    </div>
  `;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => checkApproval(assigned), 4000);
}

async function checkApproval(assigned) {
  const { data: sub } = await supabaseClient
    .from('submissions')
    .select('*')
    .eq('assigned_mission_id', assigned.id)
    .order('submitted_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  if (!sub) return;

  if (sub.approved === true) {
    clearInterval(pollTimer);
    renderResult(assigned, true, sub);
  } else if (sub.approved === false) {
    clearInterval(pollTimer);
    renderResult(assigned, false, sub);
  }
}

function renderResult(assigned, approved, sub) {
  if (approved) {
    const canDouble = assigned.level < 3 && (assigned.level === 1 || assigned.via_double === true);
    let infoMsg = '';
    if (assigned.level === 3) {
      infoMsg = '3단계는 최고 단계라 더블 도전은 여기까지예요';
    } else if (!canDouble) {
      infoMsg = '처음부터 이 단계로 바로 시작하면 더블 도전은 할 수 없어요';
    }
    contentEl.innerHTML = `
      <div class="card">
        <p>🎉 승인 완료! 상금을 어떻게 받을까요?</p>
        <button id="takeBtn">그냥 받기</button>
        ${canDouble ? '<button id="doubleBtn" class="secondary">더블 도전! (다음 단계)</button>' : ''}
        ${infoMsg ? `<p class="subtitle">${infoMsg}</p>` : ''}
      </div>
    `;
    document.getElementById('takeBtn').addEventListener('click', async () => {
      const finalPrize = getFinalPrize(assigned);
      await supabaseClient.from('assigned_missions').update({ status: 'completed', final_prize: finalPrize }).eq('id', assigned.id);
      contentEl.innerHTML = `
        <div class="card status">💰 ${finalPrize.toLocaleString()}원 상금 확정! 수고하셨어요.</div>
        <button id="nextMissionBtn">다음 미션 도전하기</button>
      `;
      document.getElementById('nextMissionBtn').addEventListener('click', renderLevelSelect);
    });
    if (canDouble) {
      document.getElementById('doubleBtn').addEventListener('click', async () => {
        await supabaseClient.from('assigned_missions').update({ status: 'doubled_up', chosen_double: true }).eq('id', assigned.id);
        const nextLevel = assigned.level + 1;
        assignMission(nextLevel, true);
      });
    }
  } else {
    renderPenaltyScreen(assigned, sub);
  }
}

async function renderPenaltyScreen(assigned, sub) {
  contentEl.innerHTML = `<div class="card status">😢 반려되었어요. 대기 시간 확인 중...</div>`;

  const { data: me } = await supabaseClient
    .from('participants')
    .select('room_id')
    .eq('id', participantId)
    .single();

  let penaltyMin = 10;
  if (me) {
    const { data: room } = await supabaseClient
      .from('rooms')
      .select('penalty_minutes')
      .eq('id', me.room_id)
      .single();
    if (room && typeof room.penalty_minutes === 'number') penaltyMin = room.penalty_minutes;
  }

  const rejectedAt = new Date(sub.approved_at || Date.now()).getTime();
  const unlockAt = rejectedAt + penaltyMin * 60000;

  contentEl.innerHTML = `
    <div class="card">
      <p>😢 반려되었어요.</p>
      <p class="status" id="penaltyTimer"></p>
      <button id="retryBtn" disabled>다시 제출하기</button>
    </div>
  `;

  const retryBtn = document.getElementById('retryBtn');
  const timerEl = document.getElementById('penaltyTimer');
  let penaltyHandle = null;

  function tick() {
    const remain = unlockAt - Date.now();
    if (remain <= 0) {
      clearInterval(penaltyHandle);
      timerEl.textContent = '✅ 이제 다시 도전할 수 있어요!';
      retryBtn.disabled = false;
    } else {
      const m = Math.floor(remain / 60000);
      const s = Math.floor((remain % 60000) / 1000);
      timerEl.textContent = `⏳ ${m}분 ${s}초 후 다시 도전할 수 있어요`;
    }
  }
  tick();
  penaltyHandle = setInterval(tick, 1000);

  retryBtn.addEventListener('click', () => {
    if (retryBtn.disabled) return;
    clearInterval(penaltyHandle);
    supabaseClient.from('assigned_missions').update({ status: '진행중' }).eq('id', assigned.id)
      .then(() => renderMissionCard(assigned));
  });
}

init();
</script>
</body>
</html>
